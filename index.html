<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#5b2d0e" />
  <title>Censo · El Buen Pastor</title>
  <link rel="stylesheet" href="styles.css?v=9" />
</head>
<body>
  <header class="cabecera">
    <div class="cabecera-texto">
      <p class="sobretitulo">Arquidiócesis de Maracaibo · Parroquia "El Buen Pastor"</p>
      <h1>Censo parroquial</h1>
      <p class="subtitulo">Registro de casas y personas</p>
    </div>
  </header>

  <nav class="tabs" aria-label="Secciones">
    <button class="tab activo" data-vista="censo">📋<span>Censo</span></button>
    <button class="tab" data-vista="stats">📊<span>Stats</span></button>
  </nav>

  <main>
    <!-- Vista: Censo -->
    <section id="vista-censo" class="vista visible">
      <div id="censo-aviso-offline"></div>
      <div id="censo-guia"></div>
      <div id="censo-form"></div>
      <div id="censo-filtros"></div>
      <div id="censo-lista"></div>
    </section>

    <!-- Vista: Estadísticas -->
    <section id="vista-stats" class="vista">
      <div id="stats-contenido"></div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="config.js?v=2"></script>
  <script src="censo.js?v=8"></script>
</body>
</html>
