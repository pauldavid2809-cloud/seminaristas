<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#1d3a5f" />
  <title>Censo · San Benito de Palermo</title>
  <link rel="icon" href="img/logo-san-benito.jpg" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="img/icono-apple-180.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Censo SBP" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" crossorigin="anonymous" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" />
  <link rel="stylesheet" crossorigin="anonymous" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
  <link rel="stylesheet" href="styles.css?v=23" />
</head>
<body>
  <header class="appbar">
    <div class="appbar-marca">
      <span class="appbar-logo"><img src="img/logo-san-benito.jpg" alt="" /></span>
      <div>
        <p class="appbar-sobre">Parroquia San Benito de Palermo</p>
        <h1 class="appbar-titulo">Censo parroquial</h1>
      </div>
    </div>
    <span id="estado-red" class="estado-red" title="Conexión"></span>
  </header>

  <main>
    <!-- Vista: Casas -->
    <section id="vista-censo" class="vista visible">
      <div id="aviso-instalar"></div>
      <div id="censo-resumen"></div>
      <div id="censo-aviso-offline"></div>
      <div id="censo-guia"></div>
      <div id="censo-filtros"></div>
      <div id="censo-lista"></div>
    </section>

    <!-- Vista: Mapa -->
    <section id="vista-mapa" class="vista">
      <div id="mapa-barra"></div>
      <div id="mapa-yo" aria-live="polite"></div>
      <div class="mapa-marco">
        <div id="mapa-general" class="mapa-general"></div>
        <button class="mapa-btn-yo" data-accion="mapa-centrarme" title="Seguirme en el mapa" aria-label="Seguirme en el mapa">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2" /><path d="M12 2v3M12 19v3M2 12h3M19 12h3" /><circle cx="12" cy="12" r="7.5" fill="none" /></svg>
        </button>
      </div>
      <div id="mapa-pie"></div>
    </section>

    <!-- Vista: Palabra (díptico de la semana) -->
    <section id="vista-palabra" class="vista">
      <div id="palabra-contenido"></div>
    </section>

    <!-- Vista: Estadísticas -->
    <section id="vista-stats" class="vista">
      <div id="stats-contenido"></div>
    </section>
  </main>

  <button id="fab" class="fab" data-accion="abrir-form">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg>
    <span>Registrar casa</span>
  </button>

  <div id="toast" class="toast" role="status" hidden></div>

  <!-- Hoja deslizable del formulario -->
  <div id="hoja" class="hoja" hidden>
    <div class="hoja-fondo" data-accion="cerrar-form"></div>
    <div id="censo-form" class="hoja-panel" role="dialog" aria-modal="true"></div>
  </div>

  <nav class="tabs" aria-label="Secciones">
    <button class="tab activo" data-vista="censo">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5" /><path d="M5.5 9.5V20h13V9.5" /><path d="M10 20v-5.5h4V20" /></svg>
      <span>Casas</span>
    </button>
    <button class="tab" data-vista="mapa">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0 1 13 0c0 5.4-6.5 11-6.5 11z" /><circle cx="12" cy="10" r="2.4" /></svg>
      <span>Mapa</span>
    </button>
    <button class="tab" data-vista="palabra">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 4h6a4 4 0 0 1 4 4v13a3 3 0 0 0-3-3H2z" /><path d="M22 4h-6a4 4 0 0 0-4 4v13a3 3 0 0 1 3-3h7z" /></svg>
      <span>Palabra</span>
    </button>
    <button class="tab" data-vista="stats">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2" /></svg>
      <span>Stats</span>
    </button>
  </nav>

  <script crossorigin="anonymous" src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script crossorigin="anonymous" src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script crossorigin="anonymous" src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="config.js?v=2"></script>
  <script src="zonas.js?v=4"></script>
  <script src="dipticos.js?v=1"></script>
  <script src="palabra.js?v=2"></script>
  <script src="censo.js?v=19"></script>
</body>
</html>
